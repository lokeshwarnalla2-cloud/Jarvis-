name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o jarvis.zip -d jarvis_project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: jarvis_project
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PilluJarvis-APK
          path: jarvis_project/app/build/outputs/apk/debug/*.apk
          
